<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="cogGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>
  <!-- Background rounded industrial badge -->
  <rect width="32" height="32" rx="7" fill="url(#cogGrad)" />
  
  <!-- Outer industrial cog teeth -->
  <g fill="url(#glowGrad)" transform="translate(16, 16)">
    <!-- 8 teeth -->
    <path d="M-2.5,-12 h5 l1,3 h-7 z" />
    <path d="M-2.5,9 h5 l-1,3 h-3 z" />
    <path d="M-12,-2.5 v5 l3,1 v-7 z" />
    <path d="M9,-2.5 v5 l3,-1 v-3 z" />
    <path d="M-9,-9 l3.5,-3.5 l2,2.5 l-3,3 z" transform="rotate(0)" />
    <path d="M9,-9 l-3.5,-3.5 l-2,2.5 l3,3 z" transform="rotate(0)" />
    <path d="M-9,9 l3.5,3.5 l2,-2.5 l-3,-3 z" transform="rotate(0)" />
    <path d="M9,9 l-3.5,3.5 l-2,-2.5 l3,-3 z" transform="rotate(0)" />
    
    <!-- Outer Cog Body Ring -->
    <circle r="8.5" fill="url(#glowGrad)" />
    
    <!-- Inner Cutout -->
    <circle r="5" fill="#0f172a" />
    
    <!-- Center telemetry core / spindle -->
    <circle r="2.5" fill="#38bdf8" />
  </g>
</svg>
